<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users & Roles · EstateFlow</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div th:replace="~{fragments/topbar :: topbar}"></div><div class="content-area"><div class="module-intro"><div><span class="eyebrow">ADMINISTRATION / ACCESS</span><h2 class="page-heading">Users & roles</h2></div></div><div class="panel table-panel"><div class="table-toolbar"><div><span class="eyebrow">TEAM DIRECTORY</span><h3 class="mb-0 mt-1">Workspace users</h3></div><span class="record-count" th:text="${rows.size()+' users'}">5 users</span></div><div class="table-responsive"><table class="table align-middle crm-table"><thead><tr><th>User</th><th>Role</th><th>Access status</th><th>Created</th><th></th></tr></thead><tbody><tr th:each="u:${rows}"><td><div class="person-cell"><div class="table-avatar purple" th:text="${#strings.substring(u.fullName,0,1)}">A</div><div><strong th:text="${u.fullName}">Admin</strong><small th:text="${'@'+u.username}">@admin</small></div></div></td><td><span class="status-pill purple" th:text="${u.role}">ADMIN</span></td><td><span class="status-pill" th:classappend="${u.enabled?'green':'red'}" th:text="${u.enabled?'ACTIVE':'DISABLED'}">ACTIVE</span></td><td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}">Today</td><td><form th:action="@{'/admin/users/toggle/'+${u.id}}" method="post"><button class="btn btn-sm btn-light" th:text="${u.enabled?'Disable':'Enable'}">Disable</button></form></td></tr></tbody></table></div></div></div></main></div><script src="/js/app.js"></script></body></html>
